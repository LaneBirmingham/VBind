[package]
name = "vbind-service"
description = "VBind runtime: device engine, profile store, agent panel and the local HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vbind-core.workspace = true
vbind-io.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1", features = ["indexmap2"] }
rust-embed = "8"
mime_guess = "2"
getrandom = "0.3"
resvg = "0.50"
base64 = "0.23.1"
imagesize = "0.15.0"
