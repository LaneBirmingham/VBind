[package]
name = "vbind-cli"
description = "vbind: command line and MCP server for driving VBind from an AI agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "vbind"
path = "src/main.rs"

[dependencies]
vbind-core.workspace = true
vbind-service.workspace = true
clap = { version = "4", features = ["derive", "wrap_help"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
base64 = "0.23"
